<div class="cosmic-app">
  <header class="cosmic-header">
    <div class="container">
      <div class="header-content">
        <div class="logo-section">
          <div class="logo-icon">🚀</div>
          <div class="title-group">
            <h1 class="cosmic-title">IISA</h1>
            <p class="subtitle">Israeli Imaginary Space Agency</p>
          </div>
        </div>
        
        <nav class="cosmic-nav">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">Home</span>
          </a>
          <a routerLink="/about" routerLinkActive="active" class="nav-link">
            <span class="nav-icon">ℹ️</span>
            <span class="nav-text">About</span>
          </a>
          <a routerLink="/contact" routerLinkActive="active" class="nav-link">
            <span class="nav-icon">📧</span>
            <span class="nav-text">Contact</span>
          </a>
          @if (authService.isRecruiter()) {
            <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
              <span class="nav-icon">📊</span>
              <span class="nav-text">Management Dashboard</span>
            </a>
          }
          @if (authService.isAuthenticated()) {
            <button (click)="logout()" class="nav-link logout-btn">
              <span class="nav-icon">🚪</span>
              <span class="nav-text">Logout</span>
            </button>
          } @else {
            <button (click)="goToRecruiterLogin()" class="nav-link login-btn">
              <span class="nav-icon">🔐</span>
              <span class="nav-text">Recruiter Login</span>
            </button>
          }
        </nav>
      </div>
    </div>
  </header>

  <main class="cosmic-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="cosmic-footer">
    <div class="container">
      <div class="footer-content">
        <p class="cosmic-body">
          © Yakov Neumann | 
           100% Israeli Space Agency | 2025
        </p>
        <div class="footer-links">
          <a routerLink="/about" class="footer-link">About</a>
          <a routerLink="/contact" class="footer-link">Contact</a>
        </div>
      </div>
    </div>
  </footer>
</div>
